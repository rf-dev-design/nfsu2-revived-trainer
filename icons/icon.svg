<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a46"/>
      <stop offset=".6" stop-color="#05101d"/>
      <stop offset="1" stop-color="#1a0e02"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9be0"/>
      <stop offset=".75" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- angled badge -->
  <path d="M18 4 H124 V96 L110 124 H4 V32 Z" fill="url(#bg)" stroke="#46c8ff" stroke-width="4"/>
  <!-- gauge arc -->
  <path d="M30 92 A38 38 0 1 1 98 92" fill="none" stroke="#0f3555" stroke-width="10" stroke-linecap="round"/>
  <path d="M30 92 A38 38 0 1 1 98 92" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <!-- ticks -->
  <g stroke="#9fe9ff" stroke-width="3" stroke-linecap="round" opacity=".85">
    <line x1="64" y1="30" x2="64" y2="38"/>
    <line x1="36" y1="46" x2="42" y2="51"/>
    <line x1="92" y1="46" x2="86" y2="51"/>
  </g>
  <!-- needle pinned to max -->
  <line x1="64" y1="72" x2="94" y2="46" stroke="#ff9a1f" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="64" cy="72" r="9" fill="#ff9a1f" stroke="#2a1200" stroke-width="3"/>
  <!-- N2O bolt -->
  <path d="M58 92 L72 92 L66 104 L78 104 L56 124 L62 110 L52 110 Z" fill="#ffd27a" stroke="#2a1200" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
